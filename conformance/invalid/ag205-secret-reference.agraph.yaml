# EXPECT: AG205
# Secrets are unreachable from expressions by construction.
ags_version: "1.0"
kind: AgenticGraph
id: conformance/ag205-secret-reference
title: Secret in an expression
objective: Demonstrate the secret-reference prohibition.
secrets:
  - name: api_token
    description: Injected by the harness, never readable from AGX.
entrypoints: [start]
nodes:
  start:
    title: Start
    description: Entry node.
    inputs:
      token:
        type: string
        description: Illegally pulls a secret into an expression.
        from: secrets.api_token
